<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t d">
  <title id="t">JOEBOT, a terminal AI agent with tool calling</title>
  <desc id="d">Animated banner for JOEBOT. A terminal AI agent that reads code, runs approved commands, searches the web and falls back across AI providers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0E2747"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EE6E6"><animate attributeName="stop-color" values="#2EE6E6;#4D9DFF;#2EE6E6" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#4D9DFF"><animate attributeName="stop-color" values="#4D9DFF;#2EE6E6;#4D9DFF" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D9DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4D9DFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4D9DFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4D9DFF" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="900" height="320" rx="18" fill="url(#bg)"/>
  <rect width="900" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="780" cy="80" r="120" fill="#4D9DFF" opacity="0.10">
    <animate attributeName="cy" values="80;115;80" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="120;138;120" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="290" r="100" fill="#2EE6E6" opacity="0.08">
    <animate attributeName="cx" values="140;220;140" dur="9s" repeatCount="indefinite"/>
  </circle>
  <rect x="-140" y="0" width="140" height="320" fill="url(#beam)">
    <animate attributeName="x" values="-140;900" dur="7s" repeatCount="indefinite"/>
  </rect>
  <circle cx="850" cy="270" r="5" fill="#2EE6E6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="70" cy="46" r="4" fill="#4D9DFF"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
  <text x="60" y="90" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" fill="#2EE6E6">$ joebot</text>
  <text x="60" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#accent)">JOEBOT</text>
  <text x="62" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#FFFFFF">Terminal AI agent with tool calling</text>
  <rect x="62" y="226" width="0" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;440;440;0" keyTimes="0;0.25;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#CFE3FF" opacity="0">Reads and searches your code<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0250;0.0500;0.2250;0.2500;1" dur="16s" repeatCount="indefinite"/></text>
  <text x="60" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#CFE3FF" opacity="0">Runs commands only when you approve<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2750;0.3000;0.4750;0.5000;1" dur="16s" repeatCount="indefinite"/></text>
  <text x="60" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#CFE3FF" opacity="0">Falls back across AI providers<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5250;0.5500;0.7250;0.7500;1" dur="16s" repeatCount="indefinite"/></text>
  <text x="60" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#CFE3FF" opacity="0">Remembers what you tell it<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7750;0.8000;0.9750;1.0000;1" dur="16s" repeatCount="indefinite"/></text>
</svg>
