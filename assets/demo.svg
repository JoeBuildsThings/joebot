<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-labelledby="t d">
  <title id="t">Illustrated JOEBOT terminal session</title>
  <desc id="d">An animated illustration of a JOEBOT session: listing files, then an approval card before a file is written.</desc>
  <rect x="1" y="1" width="898" height="488" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="38" rx="14" fill="#161B22"/>
  <circle cx="26" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="20" r="6" fill="#27C93F"/>
  <text x="450" y="25" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#8B949E">joebot</text>
  <text x="28" y="74" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="22" font-weight="700" fill="#2EE6E6">JOEBOT</text>
  <text x="28" y="96" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#8B949E">Your personal AI for Termux</text>
  <g opacity="0"><rect x="20" y="114" width="860" height="26" fill="#262626"/><text x="30" y="132" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#E6EDF3">list the files in this project</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0375;0.0562;0.8875;0.9062;1" dur="16s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="28" y="166" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#4D9DFF">● </tspan><tspan fill="#E6EDF3" font-weight="700">List(.)</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1000;0.1188;0.8875;0.9062;1" dur="16s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="28" y="188" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#8B949E">  ⎿  14 entries</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1375;0.1562;0.8875;0.9062;1" dur="16s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="28" y="216" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#4D9DFF">● </tspan><tspan fill="#E6EDF3">The project has a CLI, a server and a web app. Want me to open one?</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2188;0.8875;0.9062;1" dur="16s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="20" y="236" width="860" height="26" fill="#262626"/><text x="30" y="254" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#E6EDF3">create notes.md with a todo list</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3250;0.3438;0.8875;0.9062;1" dur="16s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="20" y="272" width="860" height="150" rx="10" fill="none" stroke="#E5C07B" stroke-width="2"/><text x="36" y="298" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#E5C07B" font-weight="700">Allow this action?</tspan></text><text x="36" y="320" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#E6EDF3">Write(notes.md)</tspan></text><text x="36" y="346" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#4D9DFF">❯ 1. Yes, once</tspan></text><text x="36" y="366" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#E6EDF3">  2. Yes, and do not ask again this session</tspan></text><text x="36" y="386" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#E6EDF3">  3. No</tspan></text><text x="36" y="410" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">enter select · y once · a session · n deny</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4125;0.4312;0.6000;0.6188;1" dur="16s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="28" y="292" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#4D9DFF">● </tspan><tspan fill="#E6EDF3" font-weight="700">Write(notes.md)</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6188;0.6375;0.8875;0.9062;1" dur="16s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="28" y="314" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#8B949E">  ⎿  Written</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6500;0.6688;0.8875;0.9062;1" dur="16s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="28" y="342" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#4D9DFF">● </tspan><tspan fill="#E6EDF3">Done. notes.md is in the project root.</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7000;0.7188;0.8875;0.9062;1" dur="16s" repeatCount="indefinite"/></g>
  <line x1="20" y1="436" x2="880" y2="436" stroke="#30363D"/>
  <text x="28" y="462" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#4D9DFF" font-weight="700">❯ </tspan><tspan fill="#8B949E">Message JOEBOT</tspan></text>
  <rect x="224" y="448" width="9" height="18" fill="#E6EDF3"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <line x1="20" y1="474" x2="880" y2="474" stroke="#30363D"/>
</svg>
