      <stop offset="0" stop-color="#2EE6E6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4D9DFF"/>
      <stop offset="1" stop-color="#2EE6E6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="2" width="900" height="4" rx="2" fill="#14233A"/>
